seed: 42

paths:
  raw: data/raw/ratings_Beauty.csv
  processed: data/processed
  recommendations: data/processed/recommendations.parquet

data:
  category: "Beauty"
  positive_rating_threshold: 4
  min_user_interactions: 5   # k-core threshold, finalized: see docs/decisions.md D1
  min_item_interactions: 5

split:
  val_frac: 0.1
  test_frac: 0.1

model:
  svd:
    n_components_grid: [32, 64, 128]
    default_n_components: 64

eval:
  k_list: [5, 10, 20]
  tuning_k: 10

output:
  top_n: 10
